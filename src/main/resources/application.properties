spring.application.name=bikestore-async

server.port=8080

# Conexion con RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Configuracion de reintentos
spring.rabbitmq.listener.simple.retry.enabled=true

# 3 intentos totales:
# 1 intento inicial + 2 reintentos
spring.rabbitmq.listener.simple.retry.max-attempts=3

# Espera entre reintentos
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000

# Evita que un mensaje fallido vuelva
# indefinidamente a la misma cola (permite enrutar a DLQ)
spring.rabbitmq.listener.simple.default-requeue-rejected=false
